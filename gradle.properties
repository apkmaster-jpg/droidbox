org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true
# DROIDBOX: this sandbox breaks Java IPv6 loopback; Gradle's daemon needs IPv4.
systemProp.java.net.preferIPv4Stack=true
# DROIDBOX: CI VM is memory-constrained; keep Gradle/Kotlin daemons small.
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
